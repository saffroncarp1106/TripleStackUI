[package]
name = "triplestack"
version = "0.3.0"
edition = "2024"

[dependencies]
anyhow = "1"
ab_glyph = "=0.2.32"
eframe = { version = "=0.33.0", default-features = false, features = ["accesskit", "default_fonts", "glow"] }
image = { version = "0.25", default-features = false, features = ["ico", "png"] }
raw-window-handle = "0.6"
rfd = { version = "0.15", default-features = false }
regex = "1"
rodio = { version = "=0.21.1", default-features = false, features = ["playback", "symphonia-wav", "symphonia-mp3", "symphonia-vorbis", "symphonia-ogg", "symphonia-flac", "symphonia-pcm"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
walkdir = "2"
windows-sys = { version = "0.61", features = ["Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
zip = { version = "4.6.1", default-features = false, features = ["deflate"] }

[build-dependencies]
embed-resource = "3"



